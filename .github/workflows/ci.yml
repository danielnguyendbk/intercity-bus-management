name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: intercity_bus_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "False"
      MYSQL_DATABASE: intercity_bus_management
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check project configuration
        run: python manage.py check
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test

  frontend:
    name: Frontend Build Check (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCK: "true"
          VITE_API_BASE_URL: "http://localhost:8000/api"
